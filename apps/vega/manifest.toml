# Deract for Fire TV (Vega OS).
schema-version = 1

[package]
title = "Deract"
version = "0.1.0"
id = "com.successaje.delayedreaction"
icon = "@image/app_icon"

[os.version]
min = "1.2"
target = "1.2"

[components]
[[components.interactive]]
id = "com.successaje.delayedreaction.main"
runtime-module = "/com.amazon.kepler.keplerscript.runtime.loader_2@IKeplerScript_2_0"
launch-type = "singleton"
categories = ["com.amazon.category.main", "com.amazon.category.kepler.media"]

[processes]
[[processes.group]]
id = "delayed_reaction_main"
component-ids = ["com.successaje.delayedreaction.main"]

[wants]
# Remote and keyboard input.
[[wants.service]]
id = "com.amazon.inputmethod.service"

[[wants.service]]
id = "com.amazon.inputd.service"

# W3C media playback.
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

# Network status for reconnect handling.
[[wants.service]]
id = "com.amazon.network.service"

[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

[needs]
[[needs.privilege]]
id = "com.amazon.media.secureplayback"

[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_2@IKeplerScript_1"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"






[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"

[[offers.interaction]]
id = "com.successaje.delayedreaction.main"

# ------------------------------------------------------------------------------
# Vega Media Controls: remote media keys, the system UI and Alexa transport
# commands reach the player through IMediaPlaybackServer.
# ------------------------------------------------------------------------------
[[extras]]
key = "interface.provider"
component-id = "com.successaje.delayedreaction.main"

[extras.value.application]
[[extras.value.application.interface]]
interface_name = "com.amazon.kepler.media.IMediaPlaybackServer"
command_options = ["Play", "Pause", "StartOver", "SkipForward", "SkipBackward"]
attribute_options = ["AudioAdvanceMuted"]
features = ["AdvancedSeek"]
